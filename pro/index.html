<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audiograph Pro — by Vladimir Petković</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <header class="topbar">
    <div class="modes" role="tablist" aria-label="Workspace">
      <button class="mode on" id="modeStudio" role="tab" aria-selected="true" title="Build visuals with nodes">Studio</button>
      <button class="mode" id="modeMap" role="tab" aria-selected="false" title="Projection mapping: fit the output onto walls, objects and screens">Mapping</button>
      <button class="mode" id="modeAuto" role="tab" aria-selected="false" title="Autopilot: describe what you want, and let it follow the music">Autopilot<i class="mode-dot"></i></button>
    </div>
    <a class="logo" href="../" title="Open the original Audiograph"><img class="logo-mark" src="./logo.svg" alt="">Audiograph<span class="logo-pro">Pro</span></a>
    <div class="toolbar">
      <button class="tbtn" id="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo">↶</button>
      <button class="tbtn" id="redo" title="Redo (⌘/Ctrl Shift Z)" aria-label="Redo">↷</button>
      <span class="sep studio-only"></span>
      <select class="tbtn studio-only" id="templates" aria-label="Start from a template"><option value="">Templates…</option></select>
      <button class="tbtn studio-only" id="randomGraph" title="Create a random node graph (Undo restores your scene)">Random</button>
      <span class="sep"></span>
      <label class="tbtn" title="Open an .ag scene (⌘O)">Open<input id="import" type="file" accept=".ag,.json,application/json" hidden></label>
      <select class="tbtn" id="save" aria-label="Save" title="Save a scene file (⌘S) or a template (⇧⌘S)"><option value="">Save…</option><option value="scene">Save scene…</option><option value="template">Save as template…</option><option value="remove">Remove a template…</option></select>
      <button class="tbtn" id="shareButton" title="Share this scene as a link">Share</button>
      <button class="tbtn" id="reset" title="Start over from the starting scene (Undo brings your scene back)">Reset</button>
      <span class="sep"></span>
      <button class="tbtn" id="midiButton" title="MIDI learn: map controller knobs, faders and pads to any knob, switch or action">MIDI</button>
      <button class="tbtn tour-btn" id="tourButton" title="Interactive tutorial: build a scene step by step">Tutorial</button>
      <button class="tbtn" id="helpButton" title="Guide">?</button>
    </div>
  </header>
  <main class="studio">
    <aside class="library" aria-label="Node library">
      <input id="librarySearch" class="search" type="search" placeholder="Search nodes…" aria-label="Search nodes">
      <div id="library"></div>
      <div id="mapPanel" class="map-panel" hidden></div>
      <div id="autoPanel" class="map-panel auto-panel" hidden></div>
    </aside>
    <section class="stage">
      <div class="preview-wrap" id="previewWrap">
        <canvas id="preview" width="960" height="540" aria-label="Composited visual preview" title="Drag to orbit 3D or move 2D · right-drag or Shift-drag pans · wheel zooms · double-click resets the view"></canvas>
        <div id="previewBadge" class="preview-badge" hidden><span></span><button type="button" class="mbtn" id="previewExit" title="Back to the output (V or Esc)">Show output</button></div>
        <svg id="mapOverlay" class="map-overlay" hidden aria-label="Projection mapping surfaces: drag points to fit"></svg>
      </div>
      <div class="gutter gutter-row" data-resize="preview" title="Drag to resize · double-click to hide or show the preview" aria-hidden="true"></div>
      <div class="transport">
        <div class="transport-side">
          <button class="btn icon" id="play" data-midi-action="play" title="Play / pause (Space)" aria-label="Play"><svg viewBox="0 0 16 16"><path class="i-play" d="M4 2.5v11l9.5-5.5z"/><path class="i-pause" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg></button>
          <button class="btn icon" id="stop" title="Stop: audio off, visuals frozen" aria-label="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button>
          <button class="btn icon rec" id="record" data-midi-action="record" title="Record the preview (and audio) to video" aria-label="Record"><svg viewBox="0 0 16 16"><circle class="i-rec" cx="8" cy="8" r="5"/><rect class="i-recstop" x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg><span class="rec-time"></span></button>
          <button class="btn icon" id="exportVideo" title="Export video: render the song frame by frame to MP4, at up to 4K / 60 fps" aria-label="Export video"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="btn icon" id="snap" title="Save the current frame as PNG" aria-label="Snapshot"><svg viewBox="0 0 16 16"><path d="M5.5 3 6.5 1.5h3L10.5 3H14v10H2V3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button type="button" id="audioName" title="Audio source · click to open the Audio node (load a file, Mic or System)">Default track · add audio</button>
        </div>
        <canvas id="spectrum" width="288" height="56" aria-label="Audio spectrum"></canvas>
        <div class="transport-side end">
          <select class="btn" id="resolution" title="Render resolution for preview, snapshots, recording and detached output. Higher resolutions use more GPU." aria-label="Output resolution">
            <option value="540">540p</option>
            <option value="720">720p</option>
            <option value="1080">1080p</option>
            <option value="1440">1440p</option>
            <option value="2160">4K</option>
          </select>
          <button class="btn icon" id="fullscreen" title="Fullscreen preview (F)" aria-label="Fullscreen"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="btn detach" id="output" title="Detach the output into its own window for a projector or second display (double-click it there for fullscreen). Use a Corner pin node to map it."><svg viewBox="0 0 16 16"><path d="M9 2h5v5M14 2 7.5 8.5M12 10v4H2V4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Detach</button>
        </div>
      </div>
      <div class="graph-region">
        <div class="graph-head">
          <div id="layers" class="layer-tabs" role="tablist" aria-label="Layer graphs"></div>
          <button class="tbtn" id="addLayer" title="Add a layer graph">+ Layer</button>
          <span class="graph-hint" id="graphHint">Tab: add node · drag output → input · click a wire to remove it · hold a node to detach</span>
          <button class="tbtn tips-btn" id="graphTips" aria-pressed="false" title="Show tips" aria-label="Show graph tips">?</button>
          <button class="tbtn" id="zoomOut" aria-label="Zoom out">−</button>
          <button class="tbtn" id="zoomIn" aria-label="Zoom in">+</button>
          <button class="tbtn" id="fit" title="Fit graph">Fit</button>
        </div>
        <div id="graphViewport" tabindex="0" aria-label="Editable node graph. Drag empty space to pan. Delete removes the selected node.">
          <div id="graphWorld"><svg id="wires" aria-label="Graph connections"></svg><div id="nodes"></div></div>
        </div>
      </div>
    </section>
    <div class="gutter gutter-col" data-resize="library" title="Drag to resize · double-click to hide or show the library" aria-hidden="true"></div>
    <div class="gutter gutter-col" data-resize="inspector" title="Drag to resize · double-click to hide or show properties" aria-hidden="true"></div>
    <aside class="inspector" aria-label="Properties">
      <div id="properties"></div>
    </aside>
  </main>
  <footer><span id="status" role="status" aria-live="polite">Ready</span><span id="selectionHint"></span></footer>
  <div id="midiPanel" class="midi-panel" hidden></div>
  <dialog id="exportDialog" class="ag-dialog">
    <h2>Export video</h2>
    <div id="exportBody"></div>
    <button class="btn" id="closeExport">Close</button>
  </dialog>
  <dialog id="shareDialog" class="ag-dialog">
    <h2>Share scene</h2>
    <div id="shareBody"></div>
    <button class="btn" id="closeShare">Close</button>
  </dialog>
  <dialog id="help">
    <h2>Audiograph <span class="logo-pro">Pro</span></h2>
    <div id="helpBody"></div>
    <button class="btn teal" id="closeHelp">Back to studio</button>
  </dialog>
  <div id="engines" aria-hidden="true"></div>
  <script type="module" src="./studio.js"></script>
</body>
</html>
