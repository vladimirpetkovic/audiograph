<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audiograph Pro — by Vladimir Petković</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../" title="Open the original Audiograph"><img class="logo-mark" src="./logo.svg" alt="">Audiograph<span class="logo-pro">Pro</span></a>
    <div class="toolbar">
      <button class="tbtn" id="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo">↶</button>
      <button class="tbtn" id="redo" title="Redo (⌘/Ctrl Shift Z)" aria-label="Redo">↷</button>
      <span class="sep"></span>
      <select class="tbtn" id="templates" aria-label="Start from a template"><option value="">Templates…</option></select>
      <span class="sep"></span>
      <button class="tbtn" id="save" title="Save in this browser">Save</button>
      <button class="tbtn" id="restore" title="Restore the project saved in this browser">Restore</button>
      <button class="tbtn" id="export" title="Download project JSON">Export</button>
      <label class="tbtn" title="Open project JSON">Import<input id="import" type="file" accept=".json,application/json" hidden></label>
      <span class="sep"></span>
      <button class="tbtn" id="helpButton" title="Guide">?</button>
    </div>
  </header>
  <main class="studio">
    <aside class="library" aria-label="Node library">
      <input id="librarySearch" class="search" type="search" placeholder="Search nodes…" aria-label="Search nodes">
      <div id="library"></div>
    </aside>
    <section class="stage">
      <div class="preview-wrap" id="previewWrap">
        <canvas id="preview" width="960" height="540" aria-label="Composited visual preview"></canvas>
        <div class="preview-hud">
          <span id="backend">Starting engine…</span>
          <button class="hbtn" id="pause" title="Pause visuals (Space)">Pause</button>
          <button class="hbtn" id="fullscreen" title="Fullscreen preview (F)">Full</button>
        </div>
      </div>
      <div class="transport">
        <label class="btn teal" title="Load an audio file">Load audio<input id="audioFile" type="file" accept="audio/*" hidden></label>
        <button class="btn" id="play">Play</button>
        <button class="btn" id="stop">Stop</button>
        <button class="btn" id="mic" title="Use the microphone as audio input">Mic</button>
        <button class="btn" id="record" title="Record the preview (and audio) to WebM">Rec</button>
        <span id="audioName">Demo signal · load audio or use the mic</span>
        <canvas id="spectrum" width="192" height="28" aria-label="Audio spectrum"></canvas>
        <meter id="audioMeter" min="0" max="1" value="0" aria-label="Audio level"></meter>
      </div>
      <div class="graph-region">
        <div class="graph-head">
          <div id="layers" class="layer-tabs" role="tablist" aria-label="Layer graphs"></div>
          <button class="tbtn" id="addLayer" title="Add a layer graph">+ Layer</button>
          <span class="graph-hint" id="graphHint">Drag from an output dot to an input. Click a wire to remove it.</span>
          <button class="tbtn" id="zoomOut" aria-label="Zoom out">−</button>
          <button class="tbtn" id="zoomIn" aria-label="Zoom in">+</button>
          <button class="tbtn" id="fit" title="Fit graph">Fit</button>
        </div>
        <div id="graphViewport" tabindex="0" aria-label="Editable node graph. Drag empty space to pan. Delete removes the selected node.">
          <div id="graphWorld"><svg id="wires" aria-label="Graph connections"></svg><div id="nodes"></div></div>
        </div>
      </div>
    </section>
    <aside class="inspector" aria-label="Properties">
      <div id="properties"></div>
    </aside>
  </main>
  <footer><span id="status" role="status" aria-live="polite">Ready</span><span id="selectionHint"></span></footer>
  <dialog id="help">
    <h2>Audiograph <span class="logo-pro">Pro</span></h2>
    <div id="helpBody"></div>
    <button class="btn teal" id="closeHelp">Back to studio</button>
  </dialog>
  <div id="engines" aria-hidden="true"></div>
  <script type="module" src="./studio.js"></script>
</body>
</html>
