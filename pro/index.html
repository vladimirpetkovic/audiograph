<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audiograph Pro — by Vladimir Petković</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./studio.css?v=lib-grid-v27">
</head>
<body>
  <header class="topbar">
    <div class="modes" role="tablist" aria-label="Workspace">
      <button class="mode on" id="modeStudio" role="tab" aria-selected="true" title="Build visuals with nodes">Studio</button>
      <button class="mode" id="modeMap" role="tab" aria-selected="false" title="Projection mapping: fit the output onto walls, objects and screens">Mapping</button>
      <button class="mode" id="modeAuto" role="tab" aria-selected="false" title="Autopilot: describe what you want, and let it follow the music">Autopilot<i class="mode-dot"></i></button>
    </div>
    <a class="logo" href="../" title="Open the original Audiograph"><img class="logo-mark" src="./logo.svg" alt=""><span class="logo-word">Audiograph</span></a>
    <div class="toolbar">
      <button class="tbtn" id="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo">↶</button>
      <button class="tbtn" id="redo" title="Redo (⌘/Ctrl Shift Z)" aria-label="Redo">↷</button>
      <span class="sep"></span>
      <label class="tbtn file-btn" title="Open an .ag scene (⌘O)">Open<input id="import" type="file" accept=".ag,.json,application/json" hidden></label>
      <select class="tbtn file-btn" id="save" aria-label="Save" title="Save a scene file (⌘S) or a template (⇧⌘S)"><option value="">Save</option><option value="scene">Save scene…</option><option value="template">Save as template…</option><option value="remove">Remove a template…</option></select>
      <button class="tbtn file-btn" id="shareButton" title="Share this scene as a link">Share</button>
      <span class="sep"></span>
      <button class="tbtn" id="midiButton" title="MIDI learn: map controller knobs, faders and pads to any knob, switch or action">MIDI</button>
      <button class="tbtn tour-btn" id="tourButton" title="Interactive tutorials: First Mile, Mapping and Autopilot">Tutorial</button>
      <button class="tbtn" id="helpButton" title="Guide">?</button>
    </div>
  </header>
  <main class="studio">
    <aside class="library" aria-label="Node library">
      <input id="librarySearch" class="search" type="search" placeholder="Search nodes…" aria-label="Search nodes">
      <div id="library"></div>
      <div id="mapPanel" class="map-panel" hidden></div>
      <div id="autoPanel" class="map-panel auto-panel" hidden></div>
    </aside>
    <section class="stage">
      <div class="preview-wrap" id="previewWrap">
        <canvas id="preview" width="960" height="540" aria-label="Composited visual preview" title="Drag to orbit 3D or move 2D · right-drag or Shift-drag pans · wheel zooms · double-click resets the view"></canvas>
        <div id="previewBadge" class="preview-badge" hidden><span></span><button type="button" class="mbtn" id="previewExit" title="Back to the output (V or Esc)">Show output</button></div>
        <svg id="mapOverlay" class="map-overlay" hidden aria-label="Projection mapping surfaces: drag points to fit"></svg>
      </div>
      <div class="gutter gutter-row" data-resize="preview" title="Drag to resize · double-click to hide or show the preview" aria-hidden="true"></div>
      <div class="transport">
        <div class="transport-side">
          <button class="btn icon" id="play" data-midi-action="play" title="Play / pause (Space)" aria-label="Play"><svg viewBox="0 0 16 16"><path class="i-play" d="M4 2.5v11l9.5-5.5z"/><path class="i-pause" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg></button>
          <button class="btn icon rec" id="record" data-midi-action="record" title="Record live: captures what you see and hear in real time (mic, system audio, your knob and MIDI moves)" aria-label="Record"><svg viewBox="0 0 16 16"><circle class="i-rec" cx="8" cy="8" r="5"/><rect class="i-recstop" x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg><span class="rec-time"></span></button>
          <button class="btn icon" id="exportVideo" title="Export video: renders a sound file offline, frame by frame, to MP4 (up to 4K / 60 fps, no dropped frames)" aria-label="Export video"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="btn icon" id="snap" title="Save the current frame as PNG" aria-label="Snapshot"><svg viewBox="0 0 16 16"><path d="M5.5 3 6.5 1.5h3L10.5 3H14v10H2V3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button type="button" id="audioName" title="Audio source · click to open the Audio node (load a file, Mic or System)">Select your audio source</button>
        </div>
        <canvas id="spectrum" width="288" height="56" aria-label="Audio spectrum"></canvas>
        <div class="transport-side end">
          <select class="btn" id="resolution" title="Render resolution for preview, snapshots, recording and detached output. Higher resolutions use more GPU." aria-label="Output resolution">
            <option value="540">540p</option>
            <option value="720">720p</option>
            <option value="1080">1080p</option>
            <option value="1440">1440p</option>
            <option value="2160">4K</option>
          </select>
          <button class="btn icon" id="fullscreen" title="Fullscreen preview (Tab)" aria-label="Fullscreen"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="btn detach" id="output" title="Detach the output into its own window for a projector or second display (double-click it there for fullscreen). Use a Corner pin node to map it."><svg viewBox="0 0 16 16"><path d="M9 2h5v5M14 2 7.5 8.5M12 10v4H2V4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Detach</button>
        </div>
      </div>
      <div class="graph-region">
        <div class="graph-head">
          <div id="layers" class="layer-tabs" role="tablist" aria-label="Layer graphs"></div>
          <button class="tbtn" id="addLayer" title="Add a layer graph">+ Layer</button>
          <span class="graph-hint" id="graphHint">Shift+A: add node · F: frame scene · Tab: fullscreen · drag output → input</span>
          <button class="tbtn tips-btn" id="graphTips" aria-pressed="false" title="Show tips" aria-label="Show graph tips">?</button>
          <span class="sep"></span>
          <div class="tpl-dd"><button class="tbtn tpl-btn" id="templates" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Start from a template">Templates</button><div class="tpl-menu" id="templateMenu" role="listbox" hidden></div></div>
          <button class="tbtn" id="randomGraph" title="Generate an editable, audio-reactive scene (Undo restores your scene)">Random</button>
          <button class="tbtn" id="reset" title="Start over from the starting scene (Undo brings your scene back)">Reset</button>
          <button type="button" class="tbtn scene-settings-btn" id="sceneSettings" aria-label="Scene settings" aria-pressed="false" aria-controls="properties" title="Scene settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.6-2 .9-2.3-1.3-2.5 4.3 1.9 1.6v2l-1.9 1.6 2.5 4.3 2.3-1.3 2 .9.6 2.6h5l.6-2.6 2-.9 2.3 1.3 2.5-4.3-1.9-1.6v-2l1.9-1.6-2.5-4.3-2.3 1.3-2-.9-.6-2.6z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="graphViewport" tabindex="0" aria-label="Editable node graph. Drag empty space to pan. Delete removes the selected node.">
          <div id="graphWorld"><svg id="wires" aria-label="Graph connections"></svg><div id="nodes"></div></div>
        </div>
        <div class="graph-zoom">
          <button class="tbtn" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
          <button class="tbtn" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
          <button class="tbtn" id="fit" title="Arrange nodes and fit the graph in view">Fit</button>
        </div>
      </div>
    </section>
    <div class="gutter gutter-col" data-resize="library" title="Drag to resize · double-click to hide or show the library" aria-hidden="true"></div>
    <div class="gutter gutter-col" data-resize="inspector" title="Drag to resize · double-click to hide or show properties" aria-hidden="true"></div>
    <aside class="inspector" aria-label="Properties">
      <div id="properties"></div>
    </aside>
  </main>
  <footer><span id="status" role="status" aria-live="polite">Ready</span><span id="selectionHint"></span></footer>
  <div id="midiPanel" class="midi-panel" hidden></div>
  <dialog id="exportDialog" class="ag-dialog">
    <h2>Export video</h2>
    <div id="exportBody"></div>
    <button class="btn" id="closeExport">Close</button>
  </dialog>
  <dialog id="shareDialog" class="ag-dialog">
    <h2>Share scene</h2>
    <div id="shareBody"></div>
    <button class="btn" id="closeShare">Close</button>
  </dialog>
  <dialog id="help">
    <h2>Audiograph <span class="logo-pro">Pro</span></h2>
    <div id="helpBody"></div>
    <button class="btn" id="openSplash">Welcome screen</button> <button class="btn teal" id="closeHelp">Back to studio</button>
  </dialog>
  <div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Welcome to Audiograph" hidden>
    <div class="splash-card">
      <video class="splash-video" id="splashVideo" muted playsinline preload="none" aria-hidden="true"></video><video class="splash-video" muted playsinline preload="none" aria-hidden="true"></video>
      <div class="splash-by">By Vladimir Petković<a href="https://www.vladimirpetkovic.com" target="_blank" rel="noopener">www.vladimirpetkovic.com</a></div>
      <div class="splash-version">Version 2.0</div>
      <button class="splash-close" id="splashClose" aria-label="Close" title="Close (Esc)">×</button>
      <div class="splash-brand">
        <img class="splash-logo" src="./splash-logo.png" alt="Audiograph">
        <div class="splash-tag">Audio-visualization studio</div>
        <div class="splash-actions"><button class="splash-btn primary" id="splashStart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>Start</button><button class="splash-btn" id="splashTour" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-1 3v2h2V8zm0 4v4h2v-4z"/></svg>Tutorial</button></div>
      </div>
      <nav class="splash-menu" id="splashMenu" aria-label="Start"></nav>
      <label class="splash-hide"><input type="checkbox" id="splashHide"> Don’t show at startup</label>
    </div>
  </div>
  <div id="engines" aria-hidden="true"></div>
  <script type="importmap">
    {
      "imports": {
        "./autopilot.js": "./autopilot.js?v=clean-ap-v28",
        "./camera.js": "./camera.js?v=scene-controls-v20",
        "./color-grade.js": "./color-grade.js?v=color-lut-v24",
        "./colliders.js": "./colliders.js?v=scene-controls-v20",
        "./curator.js": "./curator.js?v=particle-emission",
        "./director.js": "./director.js?v=unified-scene",
        "./engine.js": "./engine.js?v=fx-smooth-v23",
        "./environment.js": "./environment.js?v=scene-controls-v20",
        "./exr-types.js": "./exr-types.js?v=scene-controls-v19",
        "./fluid3d.js": "./fluid3d.js?v=color-lut-v24",
        "./gltf.js": "./gltf.js?v=surface-flow",
        "./graph.js": "./graph.js?v=fx-smooth-v28",
        "./map3d.js": "./map3d.js?v=media-store-v26",
        "./object-transform.js": "./object-transform.js?v=particle-transforms-v21",
        "./media-store.js": "./media-store.js?v=media-store-v26",
        "./media.js": "./media.js?v=emitter-media",
        "./model-materials.js": "./model-materials.js?v=surface-flow",
        "./particles3d.js": "./particles3d.js?v=particle-transforms-v21",
        "./palette-map.js": "./palette-map.js?v=scene-controls-v19",
        "./pilot.js": "./pilot.js?v=clean-ap-v28",
        "./pbr.js": "./pbr.js?v=scene-controls-v20",
        "./rigid.js": "./rigid.js?v=color-lut-v24",
        "./scene3d.js": "./scene3d.js?v=color-lut-v24",
        "./scene-lighting.js": "./scene-lighting.js?v=color-lut-v24",
        "./ui.js": "./ui.js?v=unified-scene",
        "./usd-model.js": "./usd-model.js?v=surface-flow",
        "./templates.js": "./templates.js?v=universe-scale",
        "./tour.js": "./tour.js?v=global-lighting-v21",
        "./scenes.js": "./scenes.js?v=waterfall-lite-v25"
      }
    }
  </script>
  <script type="module" src="./studio.js?v=share-fix-v31"></script>
</body>
</html>
